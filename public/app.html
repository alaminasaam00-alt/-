<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RevenueFlow — محرك تحويل العملاء</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0}main{max-width:1100px;margin:auto;padding:28px}.hero{padding:25px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#141b31;border:1px solid #26304f;border-radius:16px;padding:18px}.panel{margin-top:18px}input,textarea{width:100%;box-sizing:border-box;background:#0d1325;color:#fff;border:1px solid #34405f;border-radius:10px;padding:11px;margin:6px 0}button{background:#fff;color:#0b1020;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.run{border-top:1px solid #26304f;padding:14px 0}.muted{color:#9aa7c7}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#283552}.hot{background:#59303a}@media(max-width:800px){.grid,.row{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><div class="muted">RevenueFlow</div><h1>حوّل استفسارات العملاء إلى إجراءات ومبيعات</h1><p class="muted">محرك مبيعات يعمل من أول رسالة: يلتقط العميل → يقيّم النية → يحدد الأولوية → يجهّز الرد → يدفع الفريق للخطوة التالية.</p></section><section class="grid"><div class="card"><b id="leads">0</b><div class="muted">عملاء محتملون</div></div><div class="card"><b id="processed">0</b><div class="muted">معالجات</div></div><div class="card"><b id="hot">0</b><div class="muted">فرص ساخنة</div></div><div class="card"><b id="signal">0%</b><div class="muted">إشارة التحويل</div></div><div class="card"><b id="today">0</b><div class="muted">معالجات اليوم</div></div></section><section class="panel"><h2>إضافة عميل</h2><form id="form"><div class="row"><input name="name" placeholder="اسم العميل" required><input name="company" placeholder="الشركة"><input name="source" placeholder="المصدر (واتساب/إعلان/موقع...)" value="manual"></div><div class="row"><input name="phone" placeholder="الهاتف"><input name="email" placeholder="البريد"></div><textarea name="need" rows="4" placeholder="ما الذي يريده العميل؟" required></textarea><button>حلّل العميل ونفّذ القرار</button></form></section><section class="panel"><h2>آخر القرارات</h2><div id="runs" class="muted">جارٍ التحميل...</div></section></main><script>const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await fetch('/api/dashboard').then(r=>r.json());$('leads').textContent=d.leads;$('processed').textContent=d.processed;$('hot').textContent=d.hot;$('signal').textContent=d.intentSignal+'%';$('today').textContent=d.today;$('runs').innerHTML=d.recent.length?d.recent.map(x=>`<div class="run"><b>${esc(x.leadName)}</b> <span class="pill ${x.priority==='high'?'hot':''}">${x.priority}</span> <span class="pill">${x.score}%</span><p>${esc(x.reason)}</p><b>الخطوة:</b> ${esc(x.next)}<p class="muted">${esc(x.reply)}</p></div>`).join(''):'لا توجد عمليات بعد.'} $('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const lead=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}).then(r=>r.json());if(!lead.lead)return alert(lead.error);await fetch('/api/leads/'+lead.lead.id+'/run',{method:'POST'});e.target.reset();load()};load();setInterval(load,10000);</script><script>(async()=>{const r=await fetch('/api/session');const s=await r.json();if(!s.configured){document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px;background:#5b1a1a;color:#fff;text-align:center">لوحة الإدارة غير مؤمنة: اضبط REVENUEFLOW_ADMIN_KEY قبل الاستخدام العام.</div>');return;}if(!s.authenticated){const key=prompt('RevenueFlow Admin Key');if(!key)return;const lr=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key})});if(!lr.ok){alert('بيانات الدخول غير صحيحة');location.reload();return;}location.reload();}})();</script></body></html>
